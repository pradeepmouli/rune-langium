version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
    open-pull-requests-limit: 5
    groups:
      # Group TypeScript and related packages
      typescript:
        patterns:
          - 'typescript'
          - '@typescript/*'
          - '@types/*'
        update-types:
          - 'minor'
          - 'patch'
      # Group testing frameworks
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@testing-library/*'
        update-types:
          - 'minor'
          - 'patch'
      # Group code quality tools
      code-quality:
        patterns:
          - 'oxlint'
          - 'oxfmt'
          - 'lint-staged'
        update-types:
          - 'minor'
          - 'patch'
      # Group build tools
      build-tools:
        patterns:
          - 'vite'
          - 'tsx'
          - 'tsconfig'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # apps/docs is deliberately held at typescript 6.x. typedoc 0.28.x
      # declares a `typescript` peer of 5.0.x-6.0.x and reads the compiler's
      # internal AST surface directly; against typescript 7 (the Go-ported
      # native compiler) it dies at load with
      #   TypeError: Cannot read properties of undefined
      #   (reading 'PropertyDeclaration')   [ts4.SyntaxKind.PropertyDeclaration]
      # taking `pnpm run build` down with it. The rest of the workspace stays
      # on 7.x; only the docs app is pinned.
      #
      # Without this rule dependabot re-proposes the major every cycle, and
      # this repo's auto-merge workflow can take it without waiting for a
      # completed CI run on the resulting merge commit — silently reverting
      # the pin and breaking the docs build.
      #
      # Lift this once typedoc ships a release whose peer range admits
      # typescript 7.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    labels:
      - 'dependencies'
      - 'automated'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'

  # Enable version updates for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'ci'
      include: 'scope'
