#
# Cloudflare Worker config for the Rune DSL LSP host (feature 014-studio-prod-ready).
# DO-only Worker since spec 019 Phase 3: it hosts the RuneLspSession Durable
# Object that apps/studio/functions/api/lsp/* (Pages Functions) bind to via
# apps/studio/wrangler.toml's [[durable_objects.bindings]] script_name.
# This Worker no longer serves any HTTP routes itself — those were migrated
# to the Pages Functions — so it has no [[routes]] zone-route block.

name = "rune-lsp-worker"
main = "src/index.ts"
compatibility_date = "2026-04-24"

# nodejs_compat is load-bearing per the T035 spike — without it,
# @lspeasy/server's transitive deps (vscode-languageserver-textdocument,
# langium internals) lose access to Buffer / util.inspect at runtime.
compatibility_flags = ["nodejs_compat"]

account_id = "8327a4da4660eab7d78695268282da09"
workers_dev = false

# DO class for per-workspace LSP sessions. Implemented in src/session.ts.
# Binding name MUST match env.LSP_SESSION in src/.
[[durable_objects.bindings]]
name = "LSP_SESSION"
class_name = "RuneLspSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RuneLspSession"]

[observability]
enabled = true

[vars]
ALLOWED_ORIGIN = "https://www.daikonic.dev"

# inspector_port avoids EADDRINUSE when multiple workers run in parallel.
[dev]
port = 8790
inspector_port = 9233
