# Cloudflare Worker config for the Rune DSL LSP host (feature 014-studio-prod-ready).
# Per-workspace Durable Object holds langium services + WS hibernation; the
# Worker mints HMAC-signed session tokens and gates WS upgrades.

name = "rune-lsp-worker"
main = "src/index.ts"
compatibility_date = "2026-04-24"

# nodejs_compat is load-bearing per the T035 spike — without it,
# @lspeasy/server's transitive deps (vscode-languageserver-textdocument,
# langium internals) lose access to Buffer / util.inspect at runtime.
compatibility_flags = ["nodejs_compat"]

account_id = "8327a4da4660eab7d78695268282da09"
workers_dev = false

[[routes]]
pattern = "www.daikonic.dev/rune-studio/api/lsp/*"
zone_name = "daikonic.dev"

# DO class for per-workspace LSP sessions. Implemented in src/session.ts.
# Binding name MUST match env.LSP_SESSION in src/.
[[durable_objects.bindings]]
name = "LSP_SESSION"
class_name = "RuneLspSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RuneLspSession"]

[observability]
enabled = true


# `[vars]` is uploaded verbatim on every `wrangler deploy` (unlike Cloudflare
# Pages, this Worker has no separate dashboard-managed env-var store) — so
# ALLOWED_ORIGIN here must stay production-only. For local multi-origin dev
# (studio at http://localhost:5173 / :8788 calling this Worker directly at
# :8790, now that apps/studio/functions/api/lsp/* no longer proxies), copy
# .dev.vars.example to .dev.vars (gitignored) and widen it there — `wrangler
# dev` merges `.dev.vars` on top of `[vars]` for local runs only; it's never
# read by `wrangler deploy`.
[vars]
ALLOWED_ORIGIN = "https://www.daikonic.dev"

# inspector_port avoids EADDRINUSE when multiple workers run in parallel.
[dev]
port = 8790
inspector_port = 9233
